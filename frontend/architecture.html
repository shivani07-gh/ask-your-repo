<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repository Architecture</title>

    <link rel="stylesheet" href="architecture.css">
</head>

<body>

    <header class="header">
        <h1>Repository Architecture Explorer</h1>
    </header>

    <main class="container">

        <section id="graph-area">

            <svg id="connection-svg"></svg>

            <div id="graph-canvas">

                <div id="repository-node" class="repo-node">
                    📦 Repository
                </div>

                <div id="layer-container"></div>

            </div>

        </section>

        <aside id="details-panel">

            <h2>Layer Details</h2>

            <div id="details-content">
                Click any layer to view details.
            </div>

        </aside>


        <svg id="connection-svg">

            <defs>

                <marker
                    id="arrowhead"
                    viewBox="0 0 10 10"
                    refX="9"
                    refY="5"
                    markerWidth="8"
                    markerHeight="8"
                    orient="auto-start-reverse"
                >
                    <path
                        d="M 0 0 L 10 5 L 0 10 z"
                        fill="#2563eb"
                    />
                </marker>

            </defs>

        </svg>

    </main>

    <script src="architecture.js"></script>

</body>
</html>
